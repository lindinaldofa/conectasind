<!-- [ Header ] start -->
<header class="navbar pcoded-header navbar-expand-lg navbar-light">
    <div class="m-header">
        <a class="mobile-menu" id="mobile-collapse1" href="javascript:"><span></span></a>
        <a href="/" class="b-brand">
            <div class="b-bg" style="background-image: url('#'); background-size: cover;">
            </div>
            <span class="b-title">ConectaSind</span>
        </a>
    </div>
    <a class="mobile-menu" id="mobile-header" href="javascript:">
        <i class="feather icon-more-horizontal"></i>
    </a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav mr-auto">
            <li><a href="javascript:" class="full-screen" onclick="javascript:toggleFullScreen()">
                <i class="feather icon-maximize"></i></a>
            </li>
        </ul>
        <ul class="navbar-nav pl-4 ml-auto">
            <li>
                <label>
                    <i class="icon feather icon-sun" id="theme-indicator"></i>
                    <input type="checkbox" id="theme-switch" class="d-none">
                </label>
            </li>
            <li>
                <div class="dropdown drp-user">
                    <a href="javascript:" class="dropdown-toggle" data-toggle="dropdown">
                        {% if request.user.avatar %}
                            <img src="{{ request.user.avatar.url }}" class="img-radius" width="40px">
                        {% else %}
                            <img src="/static/assets/images/user/avatar-2.jpg" class="img-radius" width="40px"/>
                        {% endif %}
                    </a>
                    <div class="dropdown-menu dropdown-menu-right profile-notification">
                        <div class="pro-head">
                            {% if request.user.avatar %}
                                <img src="{{ request.user.avatar.url }}" class="img-radius" alt="User-Profile-Image">
                            {% else %}
                                <img src="/static/assets/images/user/avatar-2.jpg" class="img-radius" alt="User-Profile-Image"/>
                            {% endif %}
                            <span>
                                {{ request.user.first_name }}
                            </span>
                            <a href="{% url 'logout' %}" class="dud-logout" title="Logout">
                                <i class="feather icon-log-out"></i>
                            </a>
                        </div>
                        <ul class="pro-body">
                            <li><a href="{% url 'password_change' %}" class="dropdown-item"><i class="feather icon-user"></i>
                                Perfil</a></li>
                            <li><a href="{% url 'logout' %}" class="dropdown-item">
                                <i class="feather icon-lock"></i> Sair</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</header>
<!-- [ Header ] end -->
